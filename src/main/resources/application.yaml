server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    repair-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: taskflow-be

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-} logger=%logger{36} msg=%msg%n"

taskflow:
  cors:
    allowed-origins: []
  storage:
    type: ${STORAGE_TYPE:s3}
    max-file-size-bytes: 10485760
    signed-url-expiry-minutes: ${STORAGE_SIGNED_URL_EXPIRY_MINUTES:15}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - text/plain
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      bucket: ${STORAGE_S3_BUCKET:taskflow-files}
      region: ${STORAGE_S3_REGION:us-east-1}
      secure: ${STORAGE_S3_SECURE:false}
