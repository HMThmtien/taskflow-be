server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_v2
    username: taskflow_v2_user
    password: taskflow_v2_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    repair-on-migrate: true

taskflow:
  jwt:
    secret: cUNotG6VBRXJ+MKoQp5BvohOVKUfXE6JbTPfJUGeEwo=
    access-token-minutes: 120
    refresh-ttl: 2592000000  # 30 ngày (milliseconds)
