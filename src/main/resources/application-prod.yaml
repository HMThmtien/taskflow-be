spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

taskflow:
  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
    signed-url-expiry-minutes: ${STORAGE_SIGNED_URL_EXPIRY_MINUTES:15}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - text/plain
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      bucket: ${STORAGE_S3_BUCKET:taskflow-files}
      region: ${STORAGE_S3_REGION:us-east-1}
      secure: ${STORAGE_S3_SECURE:false}

  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-ttl: ${JWT_REFRESH_TTL:2592000000}

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

management:
  endpoint:
    health:
      show-details: never
