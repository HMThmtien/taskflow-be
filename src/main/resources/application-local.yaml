spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_v2
    username: taskflow_v2_user
    password: taskflow_v2_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

taskflow:
  storage:
    type: ${STORAGE_TYPE:s3}
    upload-dir: uploads
    max-file-size-bytes: 10485760
    signed-url-expiry-minutes: ${STORAGE_SIGNED_URL_EXPIRY_MINUTES:15}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - text/plain
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${STORAGE_S3_ACCESS_KEY:taskflow_minio}
      secret-key: ${STORAGE_S3_SECRET_KEY:taskflow_minio_secret_123}
      bucket: ${STORAGE_S3_BUCKET:taskflow-files}
      region: ${STORAGE_S3_REGION:us-east-1}
      secure: ${STORAGE_S3_SECURE:false}

  jwt:
    secret: PWWpaneD7Lr2RFPOBtwYKc1PkxkRKdahAJp99bSvxqY=
    access-token-minutes: 15
    refresh-ttl: 2592000000

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoint:
    health:
      show-details: always
