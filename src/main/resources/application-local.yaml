spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_v2
    username: taskflow_v2_user
    password: taskflow_v2_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

taskflow:
  storage:
    upload-dir: uploads
    max-file-size-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - text/plain

  jwt:
    secret: PWWpaneD7Lr2RFPOBtwYKc1PkxkRKdahAJp99bSvxqY=
    access-token-minutes: 15
    refresh-ttl: 2592000000

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoint:
    health:
      show-details: always
